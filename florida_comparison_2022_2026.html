<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florida 2022/2026 Comparison Turnout Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Montserrat', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
}
.header {
    background: linear-gradient(135deg, #0033A0 0%, #002070 100%);
    padding: 20px 30px;
    border-bottom: 4px solid #F8D858;
    text-align: center;
}
.header h1 { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: 1px; }
.header .subtitle { font-size: 14px; color: rgba(255,255,255,0.75); margin-top: 4px; }
.badge-live {
    display: inline-block; background: #F8D858; color: #0033A0; font-weight: 700;
    font-size: 11px; padding: 2px 10px; border-radius: 12px; margin-left: 8px;
}
.controls {
    background: #161b22; padding: 15px 30px; display: flex; align-items: center;
    gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #30363d;
}
.controls label { font-size: 13px; font-weight: 600; color: #8b949e; }
.controls .date-display { font-size: 15px; font-weight: 700; color: #F8D858; min-width: 120px; }
.controls input[type=range] { flex: 1; min-width: 200px; accent-color: #58E0E0; height: 6px; }
.controls button {
    background: #0033A0; color: white; border: none; padding: 8px 20px; border-radius: 6px;
    font-weight: 600; font-size: 13px; cursor: pointer; transition: all .2s;
    font-family: 'Montserrat', sans-serif;
}
.controls button:hover { background: #0044cc; }
.controls button:disabled { opacity: 0.4; cursor: default; }
.speed-btn {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 4px;
    font-family: 'Montserrat', sans-serif;
}
.speed-btn.active { background: #58E0E0; color: #0033A0; border-color: #58E0E0; font-weight: 700; }
.stats-row {
    display: flex; gap: 12px; padding: 12px 30px; flex-wrap: wrap;
}
.stat-card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 18px; flex: 1; min-width: 140px; text-align: center;
}
.stat-card .label { font-size: 10px; text-transform: uppercase; color: #8b949e; letter-spacing: 1px; font-weight: 600; }
.stat-card .value { font-size: 22px; font-weight: 800; margin-top: 2px; }
.stat-card .value.dem { color: #4A90D9; }
.stat-card .value.rep { color: #e03c31; }
.stat-card .value.total { color: #e6edf3; }
.maps-container { display: flex; gap: 8px; padding: 12px 30px; }
.map-panel {
    flex: 1; background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 12px; position: relative;
}
.map-panel .map-title { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.map-panel .map-title .y2022 { background: #0033A0; color: #fff; padding: 2px 12px; border-radius: 4px; }
.map-panel .map-title .y2026 { background: #58E0E0; color: #0033A0; padding: 2px 12px; border-radius: 4px; }
.map-panel svg { width: 100%; height: auto; }
.county-path {
    stroke: #0d1117; stroke-width: 0.5; transition: fill 0.3s ease; cursor: pointer;
}
.county-path:hover { stroke: #fff; stroke-width: 1.5; }
.map-legend {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin-top: 6px; font-size: 10px; color: #8b949e;
}
.map-legend .gradient-bar {
    width: 200px; height: 10px; border-radius: 3px;
    background: linear-gradient(to right, #f7f7f7, #fee08b, #fdae61, #f46d43, #d73027);
}
.county-tooltip {
    position: absolute; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; padding: 8px 12px; font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 100; max-width: 220px;
}
.county-tooltip.visible { opacity: 1; }
.county-tooltip .tt-name { font-weight: 700; color: #F8D858; margin-bottom: 4px; }
.county-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
.county-tooltip .tt-pct { font-weight: 700; }
.footer {
    text-align: center; padding: 16px 30px; font-size: 11px;
    color: #484f58; border-top: 1px solid #21262d; margin-top: 20px;
}
.footer a { color: #58E0E0; text-decoration: none; }
@media (max-width: 768px) {
    .maps-container { flex-direction: column; }
    .header h1 { font-size: 20px; }
    .stat-card .value { font-size: 18px; }
}
</style>
</head>
<body>

<div class="header">
    <h1>🗳️ FLORIDA EARLY VOTE COMPARISON <span class="badge-live">2022 → 2026</span></h1>
    <div class="subtitle">Daily Vote-by-Mail + Early In-Person Turnout by County · Animated Heat Map</div>
</div>

<div class="controls">
    <label>📅 <span class="date-display" id="dateDisplay">Loading...</span></label>
    <input type="range" id="dateSlider" min="0" max="0" value="0" step="1">
    <button id="playBtn">▶ Play</button>
    <button class="speed-btn active" data-speed="500">2x</button>
    <button class="speed-btn" data-speed="200">5x</button>

    <label style="margin-left:auto;font-size:11px">

<div class="stats-row" id="statsRow"></div>

    </div>
    <div class="map-panel" id="map2026">

        </div>

    </div>
</div>

const FIPS_MAP = {};
for (const feat of GEOJSON.features) {
    FIPS_MAP[feat.properties.fips] = feat.properties.name.replace(' County', '');
}

function getColor(pct) {
    if (pct === 0) return '#1c2128';
    if (pct < 10) return '#f7f7f7';
    if (pct < 25) return '#fee08b';
    if (pct < 50) return '#fdae61';
    if (pct < 75) return '#f46d43';
    if (pct < 90) return '#d73027';
    return '#a50026';
}

function formatNum(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'K';
    return n.toString();
}

function formatDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ═══ STATE ─────────────────────────────────────────────────────────
let currentIdx = 0;
let isPlaying = false;
let playInterval = null;
let playbackSpeed = 500;

function pathFromCoords(coords, w, h, color) {
    const bounds = { minLon: -87.6, maxLon: -80.0, minLat: 24.4, maxLat: 31.0 };
    const padding = 20;
    const scaleX = (w - 2*padding) / (bounds.maxLon - bounds.minLon);
    const scaleY = (h - 2*padding) / (bounds.maxLat - bounds.minLat);
    let d = '';
    for (let i = 0; i < coords.length; i++) {
        const x = padding + (coords[i][0] - bounds.minLon) * scaleX;
        const y = h - padding - (coords[i][1] - bounds.minLat) * scaleY;
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }
    d += 'Z';
    return d;
}

function renderMap(containerId, frame, tooltipId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const w = 500, h = 450;
    let html = '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
    for (const feat of GEOJSON.features) {
        const fips = feat.properties.fips;
        const name = feat.properties.name.replace(' County', '');
        const geo = feat.geometry;
        let color = '#1c2128', total = 0, pct = 0;
        let dem = 0, rep = 0, mail = 0, inperson = 0;

        if (frame && frame.c && frame.c[fips]) {
            const d = frame.c[fips];
            total = d[0]; pct = d[1]; dem = d[2]; rep = d[3]; mail = d[4]; inperson = d[5];
            color = getColor(pct);
        }

        const polys = geo.type === 'Polygon' ? [geo.coordinates[0]]
                    : geo.type === 'MultiPolygon' ? geo.coordinates.map(p => p[0]) : [];
        for (const coords of polys) {
            const path = pathFromCoords(coords, w, h, color);
            const info = JSON.stringify({name, total, pct, dem, rep, mail, inperson});
            html += '<path class="county-path" d="' + path + '" fill="' + color + '" data-fips="' + fips + '" data-info='' + info + ''/>';
        }
    }
    html += '</svg>';
    container.innerHTML = html;

    container.querySelectorAll('.county-path').forEach(el => {
        el.addEventListener('mousemove', function(e) {
            const rect = container.getBoundingClientRect();
            const tt = document.getElementById(tooltipId);
            const d = JSON.parse(this.dataset.info || '{}');
            tt.innerHTML = '<div class="tt-name">' + d.name + '</div>'
                + '<div class="tt-row"><span>EV+VBM</span><span>' + d.total.toLocaleString() + '</span></div>'
                + '<div class="tt-row"><span>% of final</span><span class="tt-pct" style="color:' + getColor(d.pct) + '">' + d.pct + '%</span></div>'
                + '<div class="tt-row"><span>📬 Mail</span><span>' + d.mail.toLocaleString() + '</span></div>'
                + '<div class="tt-row"><span>🏛️ Early</span><span>' + d.inperson.toLocaleString() + '</span></div>'
                + '<div class="tt-row"><span>🔵 Dem</span><span>' + d.dem.toLocaleString() + '</span></div>'
                + '<div class="tt-row"><span>🔴 Rep</span><span>' + d.rep.toLocaleString() + '</span></div>';
            tt.style.left = (e.clientX - rect.left + 12) + 'px';
            tt.style.top = (e.clientY - rect.top - 10) + 'px';
            tt.classList.add('visible');
        });
        el.addEventListener('mouseleave', function() {
            document.getElementById(tooltipId).classList.remove('visible');
        });
    });
}

function updateStats(f22, f26) {
    const row = document.getElementById('statsRow');
    const s22 = f22 ? f22.s : [0,0,0,0];
    const s26 = f26 ? f26.s : [0,0,0,0];
    const dP22 = s22[0] ? ((s22[2]/(s22[2]+s22[3])*100)).toFixed(1)+'%' : '-';
    const dP26 = s26[0] ? ((s26[2]/(s26[2]+s26[3])*100)).toFixed(1)+'%' : '-';
    const delta = s26[0] > 0 && s22[0] > 0 ? ((s26[0]/s22[0]-1)*100).toFixed(1)+'%' : '-';
    row.innerHTML =
        '<div class="stat-card"><div class="label">2022 Total EV+VBM</div><div class="value total">'+formatNum(s22[0])+'</div><div style="font-size:10px;color:#8b949e">+'+formatNum(s22[1])+' new</div></div>'
        + '<div class="stat-card"><div class="label">2022 Dem Share</div><div class="value dem">'+dP22+'</div><div style="font-size:10px;color:#8b949e">D '+formatNum(s22[2])+' · R '+formatNum(s22[3])+'</div></div>'
        + '<div class="stat-card"><div class="label">2026 Total EV+VBM</div><div class="value total">'+formatNum(s26[0])+'</div><div style="font-size:10px;color:#8b949e">+'+formatNum(s26[1])+' new</div></div>'
        + '<div class="stat-card"><div class="label">2026 Dem Share</div><div class="value dem">'+dP26+'</div><div style="font-size:10px;color:#8b949e">D '+formatNum(s26[2])+' · R '+formatNum(s26[3])+'</div></div>'
        + '<div class="stat-card" style="border-left:3px solid #F8D858"><div class="label">2026 vs 2022</div><div class="value" style="color:#F8D858">'+delta+'</div><div style="font-size:10px;color:#8b949e">same DTE comparison</div></div>';
}

function render(idx) {
    const sync = FRAMES[idx];
    if (!sync) return;

    const f22 = sync.f22, f26 = sync.f26;
    const displayDate = f26 ? f26.d : (f22 ? f22.d : '');
    document.getElementById('dateDisplay').textContent = formatDate(displayDate);

    const dte = sync.dte;
    const dteText = dte > 1 ? dte + ' days before Election Day'
        : dte === 1 ? '1 day before Election Day'
        : dte === 0 ? '🗳️ Election Day!'
        : 'Final (' + Math.abs(dte) + ' days after)';
    document.getElementById('daysToElection').textContent = dteText;

    renderMap('mapSvg2022', f22, 'tooltip2022');
    renderMap('mapSvg2026', f26, 'tooltip2026');
    updateStats(f22, f26);

    document.getElementById('dateSlider').max = FRAMES.length - 1;
    document.getElementById('dateSlider').value = idx;

    if (f22) document.getElementById('legend2022').textContent = 'of 2022 final (' + formatNum(f22.s[0]) + ')';
    if (f26) document.getElementById('legend2026').textContent = 'of 2026 final (' + formatNum(f26.s[0]) + ')';
}

// ═══ PLAYBACK ══════════════════════════════════════════════════════
document.getElementById('playBtn').addEventListener('click', () => {
    if (isPlaying) {
        clearInterval(playInterval);
        isPlaying = false;
        document.getElementById('playBtn').textContent = '▶ Play';
    } else {
        if (currentIdx >= FRAMES.length - 1) currentIdx = 0;
        isPlaying = true;
        document.getElementById('playBtn').textContent = '⏸ Pause';
        playInterval = setInterval(() => {
            if (currentIdx >= FRAMES.length - 1) {
                clearInterval(playInterval);
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶ Play';
                return;
            }
            currentIdx++;
            render(currentIdx);
        }, playbackSpeed);
    }
});

document.getElementById('dateSlider').addEventListener('input', function() {
    if (isPlaying) {
        clearInterval(playInterval);
        isPlaying = false;
        document.getElementById('playBtn').textContent = '▶ Play';
    }
    currentIdx = parseInt(this.value);
    render(currentIdx);
});

document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        playbackSpeed = parseInt(this.dataset.speed);
        if (isPlaying) {
            clearInterval(playInterval);
            playInterval = setInterval(() => {
                if (currentIdx >= FRAMES.length - 1) {
                    clearInterval(playInterval); isPlaying = false;
                    document.getElementById('playBtn').textContent = '▶ Play';
                    return;
                }
                currentIdx++; render(currentIdx);
            }, playbackSpeed);
        }
    });
});

// ═══ INIT ══════════════════════════════════════════════════════════
document.getElementById('updatedAt').textContent = new Date().toLocaleString();
render(0);
</script>
